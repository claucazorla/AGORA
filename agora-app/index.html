<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Argue with the dead. A Socratic-style philosophical dialogue app grounded in Plato's early dialogues."
    />
    <title>Agora - Argue with the dead</title>
    <script>
      (function () {
        function computeDark() {
          var explicit = document.documentElement.getAttribute("data-theme");
          if (explicit === "dark") return true;
          if (explicit === "light") return false;
          return window.matchMedia("(prefers-color-scheme: dark)").matches;
        }
        function apply() {
          document.documentElement.classList.toggle("dark", computeDark());
        }
        apply();
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", apply);
        new MutationObserver(apply).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["data-theme"],
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
